# abaplint against the abap2UI5 framework dependency, plus the two gates that
# keep the generated BSP honest.
#
# The abap2UI5-linter's headless view render is deliberately not run here: it
# validates views against the UI5 metadata snapshot, which does not know
# z2ui5_ccc.cc.Example - a control shipped from its own BSP is invisible to it
# by definition.
name: check

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: abaplint (expect 0 issues)
        run: npx --yes @abaplint/cli@2.120.73 abaplint.jsonc

  app2bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # the generated BSP artefacts must match app/webapp - a stale page would
      # deploy old JavaScript without anyone noticing
      - name: app2bsp is up to date
        run: |
          npm run app2bsp
          git diff --exit-code -- src

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: syntax check the frontend artefacts
        run: |
          for f in $(find app/webapp -name '*.js'); do node --check "$f"; done
