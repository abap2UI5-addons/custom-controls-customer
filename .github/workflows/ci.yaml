name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      Standard ABAP (abaplint.jsonc) and ABAP Cloud
#                 (.github/abaplint/abap_cloud.jsonc), against the abap2UI5
#                 framework dependency
#   npm-scripts   check:js - every script under app/webapp parses
#                 check:bsp - the generated BSP in src/01 matches
#                 npm run app2bsp (a stale page would deploy old JavaScript
#                 without anyone noticing)
#
# No abap2UI5-linter here: its headless view render validates views against
# the UI5 metadata snapshot, which does not know z2ui5_ccc.cc.Example - a
# control shipped from its own BSP is invisible to it by definition - and the
# repository has no abap2ui5lint.jsonc. No ABAP Unit tests and no rename
# script, so no unit and no rename job either.

on:
  push:
    branches: [main]
  pull_request:
  # abap2UI5 is resolved from its main branch with no version pin: the weekly
  # run notices an upstream rename while no pull request is open
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # the template's publish-badges asks for contents: write, and GitHub
    # refuses a run whose called job asks for more than the caller grants;
    # with abap2ui5lint off it never runs, every other job is read-only
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
    with:
      abaplint: '["./abaplint.jsonc", ".github/abaplint/abap_cloud.jsonc"]'
      npm-scripts: '["check:js", "check:bsp"]'
      abap2ui5lint: false
      canary: ${{ github.event_name == 'schedule' }}
